version: '3.8'

services:
  # MySQL 資料庫 (使用容器內服務節省成本)
  mysql:
    image: mysql:8.0
    container_name: pet-adoption-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pet_adoption}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # 僅內部容器訪問
    expose:
      - "3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - pet-adoption-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Redis (使用容器內服務節省成本)
  redis:
    image: redis:7-alpine
    container_name: pet-adoption-redis
    restart: unless-stopped
    # 內部網路無需密碼，降低複雜度
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - pet-adoption-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 5s
      retries: 3

  # MinIO (Object Storage) - 使用容器內服務節省成本
  minio:
    image: minio/minio:latest
    container_name: pet-adoption-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL}
    # 僅內部訪問，管理控制台可選擇性開放
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - pet-adoption-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Flask 後端
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: pet-adoption-backend
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      # 資料庫配置
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-pet_adoption}
      # Redis 配置 (無密碼)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # MinIO 配置
      MINIO_ENDPOINT: minio:9000
      MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_SECURE: "false"
      MINIO_BUCKET: pet-adoption
      # 應用程式密鑰
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # CORS 配置
      CORS_ORIGINS: ${CORS_ORIGINS}
      # SMTP 設定
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_FROM: ${SMTP_FROM}
      # Frontend URL (for email links)
      FRONTEND_URL: ${FRONTEND_URL}
      APP_NAME: ${APP_NAME:-Pet Adoption Platform}
    expose:
      - "5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - pet-adoption-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Celery Worker (低並發節省資源)
  celery-worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: pet-adoption-celery
    restart: unless-stopped
    command: celery -A app.celery worker --loglevel=info --concurrency=2
    environment:
      FLASK_ENV: production
      # 與 backend 相同的配置
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-pet_adoption}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # SMTP 設定
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_FROM: ${SMTP_FROM}
      # MinIO 配置
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_SECURE: "false"
      MINIO_BUCKET: pet-adoption
      # 應用程式密鑰
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - pet-adoption-network

  # Vue 3 前端 (建議部署到 Cloud Storage + CDN 或 Firebase Hosting)
  # 如使用靜態託管服務，可移除此服務
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: pet-adoption-frontend
    restart: always
    environment:
      NODE_ENV: production
    # 映射到 VM 的 80 端口，允許外部訪問
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pet-adoption-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mysql-data:
  redis-data:
  minio-data:

networks:
  pet-adoption-network:
    driver: bridge
