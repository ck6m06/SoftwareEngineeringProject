# ========================================
# Nginx Server 配置 - 適用於 /etc/nginx/conf.d/
# ========================================
# 用途: 用於 Docker 部署（開發/生產）
# 位置: 會被複製到 /etc/nginx/conf.d/default.conf
# 注意: 只包含 server 區塊，不包含 http 區塊配置
# ========================================

server {
    listen 80;
    # 接受所有域名和 IP (GCP 部署時可以指定具體域名)
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    # 安全性標頭
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 限制請求大小 (防止大檔案上傳攻擊)
    client_max_body_size 50M;

    # 超時設定
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # SPA 路由處理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    location /api/ {
        # GCP 環境使用容器名稱
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        
        # WebSocket 支援
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # 保留原始資訊
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # 傳遞真實 IP (重要！用於日誌和安全)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS 預檢請求快速回應
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $http_origin;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # MinIO 物件儲存代理 (圖片訪問)
    # 訪問路徑: http://domain/minio/bucket-name/object-name
    # 轉發到: http://minio:9000/bucket-name/object-name
    # 注意: 使用 ^~ 前綴確保優先級高於正則匹配
    location ^~ /minio/ {
        # 不使用結尾斜線，保留完整路徑（包含 /minio/ 後的所有內容）
        # 然後用 rewrite 去掉 /minio 前綴
        rewrite ^/minio/(.*)$ /$1 break;
        proxy_pass http://minio:9000;
        
        # 強制指定 Host，避免 MinIO 誤判 Bucket
        proxy_set_header Host $http_host;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 圖片快取 1 週（MinIO 動態內容）
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 前端靜態資源快取（僅針對前端編譯產生的檔案）
    # 不包含 MinIO 的圖片（已由上面的 ^~ 前綴規則優先處理）
    location ~* \.(css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # 前端靜態圖片（favicon, logo 等，非 MinIO）
    location ~* ^/assets/.*\.(jpg|jpeg|png|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 禁止訪問隱藏檔案
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 健康檢查端點
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

